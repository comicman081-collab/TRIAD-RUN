name: Deploy compact production Pages

on:
  push:
    branches: [codex/pages-release]

concurrency:
  group: production-pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout only the compact release
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Verify release integrity and size
        run: |
          node <<'NODE'
          const fs = require('fs'), crypto = require('crypto');
          const m = JSON.parse(fs.readFileSync('release-version.json'));
          let bytes = 0;
          for (const f of m.files) {
            const b = fs.readFileSync(f.path);
            if (b.length !== f.bytes || crypto.createHash('sha256').update(b).digest('hex') !== f.sha256) throw Error('Release mismatch: ' + f.path);
            bytes += b.length;
          }
          if (bytes !== m.runtimeBytes || bytes > 300000000) throw Error('Unexpected release size');
          if (fs.existsSync('quarantine') || fs.existsSync('source_assets') || fs.existsSync('tools')) throw Error('Non-runtime files in release');
          console.log(m.files.length + ' verified runtime files; ' + bytes + ' bytes; source ' + m.canonicalCommit);
          NODE
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload the sole required Pages artifact
        id: upload
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: .
          retention-days: 1
      - name: Deploy production
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Delete this run's temporary Pages artifact
        if: ${{ always() && steps.upload.outputs.artifact_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          node <<'NODE'
          (async () => {
            const {GITHUB_REPOSITORY: repo, GITHUB_RUN_ID: run, ARTIFACT_ID: id, GH_TOKEN: token} = process.env;
            const url = 'https://api.github.com/repos/' + repo + '/actions/artifacts/' + id;
            const headers = {Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2026-03-10'};
            const info = await fetch(url, {headers});
            if (info.status === 404) return;
            if (!info.ok) throw Error('Artifact lookup failed: ' + info.status);
            const a = await info.json();
            if (a.name !== 'github-pages' || String(a.workflow_run.id) !== run) throw Error('Artifact ownership mismatch');
            const removed = await fetch(url, {method: 'DELETE', headers});
            if (removed.status !== 204 && removed.status !== 404) throw Error('Artifact deletion failed: ' + removed.status);
            console.log('Removed temporary Pages artifact ' + id + '; deployed site is retained.');
          })().catch(e => { console.error(e.message); process.exitCode = 1; });
          NODE
